    const ws = new WebSocket('wss://stream.binance.com:9443/ws/!ticker@arr');
    let livePrices = {};

    ws.onmessage = (event) => {
      const tickers = JSON.parse(event.data);
      tickers.forEach(t => {
        const symbol = t.s;
        const current = parseFloat(t.c);
        const prev = livePrices[symbol] || current;
        livePrices[symbol] = current;

        if (symbol === 'BTCUSDT') {
          const btcEl = document.getElementById('btc-price');
          const badgeEl = document.getElementById('btc-badge');
          btcEl.innerText = '$' + current.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
          btcEl.classList.remove('flash-green', 'flash-red');
          btcEl.classList.add(current >= prev ? 'flash-green' : 'flash-red');
          const change = parseFloat(t.priceChangePercent);
          badgeEl.innerText = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
          badgeEl.className = 'px-2 py-0.5 rounded text-xs mono font-bold ' + (change >= 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800');
          document.getElementById('btc-low').innerText = '$' + parseFloat(t.lowPrice).toLocaleString();
          document.getElementById('btc-high').innerText = '$' + parseFloat(t.highPrice).toLocaleString();
        }

        const pEl = document.getElementById('price-' + symbol);
        const lpEl = document.getElementById('log-price-' + symbol);
        const statusEl = document.getElementById('log-status-' + symbol);

        if (pEl) {
          pEl.innerText = '$' + current;
          pEl.classList.remove('flash-green', 'flash-red');
          pEl.classList.add(current >= prev ? 'flash-green' : 'flash-red');
        }
        if (lpEl) lpEl.innerText = '$' + current;

        const candidate = activeCandidates.find(c => c.symbol === symbol);
        if (candidate && statusEl) {
          if (current >= candidate.tp1 && candidate.status === 'IN-PLAY') {
            candidate.status = 'TP1 HIT';
            statusEl.innerHTML = '<span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[11px]">🟢 TP1 HIT (+1.5%)</span>';
          } else if (current <= candidate.sl && candidate.status === 'IN-PLAY') {
            candidate.status = 'SL HIT';
            statusEl.innerHTML = '<span class="bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded text-[11px]">🔴 SL HIT (-0.9%)</span>';
          }
        }
      });

        const price = parseFloat(data.lastPrice);
        const quoteVol = (parseFloat(data.quoteVolume) / 1000000).toFixed(2);
        const priceChange = parseFloat(data.priceChangePercent);

        container.innerHTML = \`
          <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col gap-4">
